<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Atlas — navegación con datos reales de OpenStreetMap, rutas A* y estilos visuales de mapa." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Conexiones anticipadas a los servidores que se usan al arrancar. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
    <link rel="dns-prefetch" href="https://overpass-api.de" />
    <link rel="dns-prefetch" href="https://nominatim.openstreetmap.org" />
    <title>Atlas · Navegación</title>
  </head>
  <body>
    <!-- Se pinta al instante, antes de descargar la app; React lo sustituye al arrancar. -->
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #eef1f4; font: 600 14px system-ui, sans-serif; color: #475569; }
      #boot .panel { position: absolute; top: 16px; left: 16px; bottom: 16px; width: 400px; border-radius: 24px; background: rgba(255,255,255,.75); box-shadow: 0 10px 40px -12px rgba(2,6,23,.3); }
      #boot .logo { display: flex; align-items: center; gap: 10px; }
      #boot .logo i { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#22d3ee,#a855f7); animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { to { opacity: .45; transform: scale(.92); } }
      @media (max-width: 767px) { #boot .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 132px; border-radius: 24px 24px 0 0; } }
      @media (prefers-color-scheme: dark) { #boot { background: #0b1020; color: #94a3b8; } #boot .panel { background: rgba(18,26,46,.8); } }
    </style>
    <div id="root"><div id="boot"><div class="panel"></div><div class="logo"><i></i>Atlas</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
